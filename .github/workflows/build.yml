name: Build APK

# After every merge to master: an APK to download from the run.
# On a version tag (git tag v0.3.0 && git push origin v0.3.0): also a
# GitHub Release with the APKs attached.
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # to create the release on tags
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true

      - run: flutter pub get

      # One APK per phone type keeps each download small.
      # Signed with the debug key for now: fine for testing, not the Play Store.
      - name: Build
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: dysgraphia-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*-release.apk
          generate_release_notes: true
